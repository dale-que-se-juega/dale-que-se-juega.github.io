<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fulbo Manager</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f5;
      color: #1f2937;
    }

    header {
      background: linear-gradient(135deg, #064e3b, #15803d);
      color: white;
      text-align: center;
      padding: 40px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 36px;
    }

    header p {
      margin-top: 8px;
      opacity: 0.9;
    }

    main {
      max-width: 850px;
      margin: 30px auto;
      padding: 20px;
    }
  </style>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="logo">
    <h1>⚽ Fulbo Manager</h1>
    <p>Organizá tus partidos. Armá tus equipos. Jugá.</p>
  </header>

  <main class="app">
    <section id="acceso" class="card">
  <h2 class="section-title">Ingresar</h2>

  <input
    type="email"
    id="email"
    class="input-field"
    placeholder="Tu email"
  >

  <input
    type="password"
    id="password"
    class="input-field"
    placeholder="Tu contraseña"
  >

<button class="btn-secondary" onclick="registrarse()">Registrarme</button>
<button class="btn-primary" onclick="iniciarSesion()">Iniciar sesión</button>

  <p id="estado-auth"></p>
</section>
    <section id="proximo-partido">
  <h2>Próximo partido</h2>
  <div id="datos-partido">
    <p>Cargando partido...</p>
  </div>
          <button onclick="anotarme()">Anotarme</button>
<p id="estado-inscripcion"></p>
</section>
    <section id="inscriptos">
  <h2>Inscriptos</h2>
      <p id="contador-inscriptos"></p>
  <div id="lista-inscriptos">
    <p>Cargando inscriptos...</p>
  </div>
  
</section>
    <h2>Jugadores</h2>
    <p>Administrá los jugadores de tu grupo de fútbol.</p>
    <div id="lista-jugadores"></div>
  </main>
<script>
  const SUPABASE_URL = "https://xwdslmdvgicenqqbrqev.supabase.co";
  const SUPABASE_KEY = "sb_publishable_4J2txbexu0gyhnFvmGtDjQ_9Ic2vDN5";

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  async function registrarse() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const estado = document.getElementById("estado-auth");

  const { data, error } = await db.auth.signUp({
    email,
    password
  });

  if (error) {
    estado.textContent = "Error: " + error.message;
    return;
  }

  estado.textContent = "Registro realizado. Revisá tu email.";
}

async function iniciarSesion() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const estado = document.getElementById("estado-auth");

  const { data, error } = await db.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    estado.textContent = "Error: " + error.message;
    return;
  }

  estado.textContent = "Sesión iniciada correctamente.";
}
  async function cargarJugadores() {
  const { data, error } = await db
    .from("jugadores")
    .select("*");

  const contenedor = document.getElementById("lista-jugadores");

  if (error) {
    contenedor.innerHTML = "<p>Error al cargar jugadores.</p>";
    console.error(error);
    return;
  }

  contenedor.innerHTML = data.map(jugador => `
    <p>⚽ <strong>${jugador.alias}</strong></p>
  `).join("");
}
async function cargarPartidos() {
  const { data, error } = await db
    .from("partidos")
    .select("*")
    .order("fecha", { ascending: true });

  if (error) {
    console.error("Error al cargar partidos:", error);
    return;
  }

  const contenedor = document.getElementById("datos-partido");

if (!data || data.length === 0) {
  contenedor.innerHTML = "<p>No hay partidos programados.</p>";
  return;
}

const partido = data[0];

contenedor.innerHTML = `
  <p><strong>${partido.dia}</strong></p>
  <p>📅 ${partido.fecha}</p>
  <p>⏰ ${partido.hora}</p>
  <p>Estado: ${partido.estado}</p>
`;
}
  async function cargarInscriptos() {
  const { data, error } = await db
    .from("inscripciones")
    .select(`
      estado,
      equipo,
      jugadores (
        alias
      )
    `)
    .eq("partido_id", 1);

  const contenedor = document.getElementById("lista-inscriptos");

  if (error) {
    contenedor.innerHTML = "<p>Error al cargar inscriptos.</p>";
    console.error(error);
    return;
  }
const contador = document.getElementById("contador-inscriptos");

const cantidad = data.length;
const lugares = Math.max(14 - cantidad, 0);

contador.textContent =
  `${cantidad} de 14 inscriptos · ${lugares} lugares disponibles`;
  if (!data || data.length === 0) {
    contenedor.innerHTML = "<p>Todavía no hay jugadores inscriptos.</p>";
    return;
  }

  const titulares = data.filter(inscripcion => inscripcion.estado === "titular");
const suplentes = data.filter(inscripcion => inscripcion.estado === "suplente");

contenedor.innerHTML = `
  <h3>Titulares (${titulares.length})</h3>

  ${titulares.map(inscripcion => `
    <p>⚽ <strong>${inscripcion.jugadores.alias}</strong></p>
  `).join("")}

  <h3>Suplentes (${suplentes.length})</h3>

  ${
    suplentes.length > 0
      ? suplentes.map(inscripcion => `
          <p>🪑 <strong>${inscripcion.jugadores.alias}</strong></p>
        `).join("")
      : "<p>No hay suplentes.</p>"
  }
`;
}
  async function anotarme() {
  const estado = document.getElementById("estado-inscripcion");

  const { data: { user } } = await db.auth.getUser();

  if (!user) {
    estado.textContent = "Primero tenés que iniciar sesión.";
    return;
  }

  const { data: jugador, error: errorJugador } = await db
    .from("jugadores")
    .select("id")
    .eq("email", user.email)
    .single();

  if (errorJugador || !jugador) {
    estado.textContent = "No encontramos un jugador asociado a este usuario.";
    return;
  }
    const { data: yaInscripto, error: errorDuplicado } = await db
  .from("inscripciones")
  .select("id")
  .eq("partido_id", 1)
  .eq("jugador_id", jugador.id)
  .maybeSingle();

if (errorDuplicado) {
  estado.textContent = "Error al verificar la inscripción.";
  return;
}

if (yaInscripto) {
  estado.textContent = "Ya estás anotado en este partido.";
  return;
}
    const { count, error: errorCupo } = await db
  .from("inscripciones")
  .select("*", { count: "exact", head: true })
  .eq("partido_id", 1)
  .eq("estado", "titular");

if (errorCupo) {
  estado.textContent = "Error al verificar los cupos.";
  return;
}

const nuevoEstado = count < 14 ? "titular" : "suplente";

  const { error } = await db
    .from("inscripciones")
    .insert({
      partido_id: 1,
      jugador_id: jugador.id,
     estado: nuevoEstado
    });

  if (error) {
    estado.textContent = "Error al anotarte: " + error.message;
    return;
  }

  estado.textContent = "Te anotaste correctamente.";
  cargarInscriptos();
}
cargarJugadores();
  cargarPartidos();
  cargarInscriptos();
</script>
</body>
</html>
